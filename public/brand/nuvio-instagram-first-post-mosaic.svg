<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Primeiro post da Nuvio com a nova logo Mosaico</title>
  <desc id="desc">Recriação do primeiro post da Nuvio preservando a composição original e substituindo a logo pelo símbolo Mosaico.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4B942"/><stop offset=".52" stop-color="#F4B942"/><stop offset="1" stop-color="#F4B942"/></linearGradient>
    <linearGradient id="mosaicA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4B942"/><stop offset="1" stop-color="#F4B942"/></linearGradient>
    <linearGradient id="mosaicB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4B942"/><stop offset="1" stop-color="#F4B942"/></linearGradient>
    <radialGradient id="halo" cx="50%" cy="35%" r="68%"><stop offset="0" stop-color="#334155" stop-opacity=".72"/><stop offset=".58" stop-color="#334155" stop-opacity=".22"/><stop offset="1" stop-color="#1E293B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1080" height="1350" fill="#1E293B"/>
  <rect width="1080" height="900" fill="url(#halo)"/>
  <circle cx="963" cy="182" r="180" fill="#F4B942" opacity=".12"/>
  <circle cx="963" cy="182" r="95" fill="#F4B942" opacity=".10"/>

  <!-- Nova assinatura Mosaico, mantendo a proporção e a posição da logo original. -->
  <g transform="translate(78 78) scale(.30)">
    <rect x="0" y="0" width="82" height="82" rx="20" fill="url(#mosaicA)"/>
    <rect x="98" y="0" width="82" height="82" rx="20" fill="#334155" stroke="#F4B942" stroke-width="5"/>
    <rect x="0" y="98" width="82" height="82" rx="20" fill="#334155" stroke="#F4B942" stroke-width="5"/>
    <rect x="98" y="98" width="82" height="82" rx="20" fill="url(#mosaicB)"/>
    <path d="M41 41h98v98H41Z" fill="#1E293B" transform="rotate(45 90 90)"/>
  </g>
  <text x="180" y="129" fill="#FFFFFF" font-family="Manrope,Arial,sans-serif" font-size="44" font-weight="800" letter-spacing="-2">nuvio</text>

  <rect x="78" y="250" width="300" height="52" rx="26" fill="#334155" stroke="#F4B942" stroke-opacity=".38"/>
  <text x="228" y="284" fill="#F4B942" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">BEM-VINDO À NUVIO</text>

  <text x="78" y="430" fill="#FFFFFF" font-family="Manrope,Arial,sans-serif" font-size="82" font-weight="800" letter-spacing="-3">Seu negócio</text>
  <text x="78" y="526" fill="#FFFFFF" font-family="Manrope,Arial,sans-serif" font-size="82" font-weight="800" letter-spacing="-3">merece ser</text>
  <text x="78" y="622" fill="url(#brand)" font-family="Manrope,Arial,sans-serif" font-size="82" font-weight="800" letter-spacing="-3">encontrado.</text>

  <text x="78" y="744" fill="#F4B942" font-family="DM Sans,Arial,sans-serif" font-size="30"><tspan x="78">Criamos sites estratégicos para pequenas empresas</tspan><tspan x="78" dy="45">que querem ser vistas, lembradas e escolhidas.</tspan></text>

  <rect x="78" y="920" width="924" height="232" rx="28" fill="#334155" stroke="#F4B942" stroke-opacity=".30"/>
  <rect x="78" y="920" width="10" height="232" rx="5" fill="url(#brand)"/>
  <text x="126" y="990" fill="#FFFFFF" font-family="Manrope,Arial,sans-serif" font-size="28" font-weight="800">Presença digital com propósito.</text>
  <text x="126" y="1040" fill="#F4B942" font-family="DM Sans,Arial,sans-serif" font-size="24">Design, tecnologia e estratégia</text>
  <text x="126" y="1077" fill="#F4B942" font-family="DM Sans,Arial,sans-serif" font-size="24">para aproximar negócios e pessoas.</text>
  <text x="126" y="1120" fill="#F4B942" font-family="DM Sans,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="1.5">É SÓ O COMEÇO.</text>

  <path d="M0 1264 C190 1208 328 1312 518 1260 C706 1208 842 1194 1080 1230" fill="none" stroke="url(#brand)" stroke-width="7" opacity=".92"/>
  <path d="M0 1284 C190 1228 328 1332 518 1280 C706 1228 842 1214 1080 1250" fill="none" stroke="#F4B942" stroke-width="2" opacity=".25"/>
  <text x="1002" y="1302" fill="#F4B942" text-anchor="end" font-family="DM Sans,Arial,sans-serif" font-size="18" letter-spacing="1">NUVIO</text>
</svg>
