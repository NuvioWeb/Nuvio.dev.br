<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Banner da Nuvio - identidade Mosaico</title>
  <desc id="desc">Template horizontal de banner da Nuvio com símbolo modular e mensagem de posicionamento.</desc>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4B942"/><stop offset=".52" stop-color="#F4B942"/><stop offset="1" stop-color="#F4B942"/></linearGradient><radialGradient id="halo" cx="80%" cy="40%" r="70%"><stop offset="0" stop-color="#334155" stop-opacity=".68"/><stop offset="1" stop-color="#1E293B" stop-opacity="0"/></radialGradient></defs>
  <rect width="1600" height="520" fill="#1E293B"/><rect width="1600" height="520" fill="url(#halo)"/>
