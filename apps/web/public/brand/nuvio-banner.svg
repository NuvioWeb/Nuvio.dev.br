  <text x="92" y="378" fill="url(#g)" font-family="Manrope,Arial,sans-serif" font-size="62" font-weight="800">ser encontrada.</text>
  <text x="92" y="435" fill="#F4B942" font-family="DM Sans,Arial,sans-serif" font-size="25">Sites estratégicos para pequenos negócios.</text>
